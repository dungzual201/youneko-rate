name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to build and upload'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/youneko-rate-release.jks"

      - name: Assemble signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/youneko-rate-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Create or update GitHub Release and upload signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ASSET="youneko-rate-${RELEASE_TAG#v}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_ASSET"
          gh release delete-asset "$RELEASE_TAG" youneko-rate-20.01.07-debug.apk --yes 2>/dev/null || true
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
            gh release edit "$RELEASE_TAG" --title "Youneko Rate! ${RELEASE_TAG}"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \\
              --generate-notes \\
              --title "Youneko Rate! ${RELEASE_TAG}"
          fi
