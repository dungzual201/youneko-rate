name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to build and upload'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_HEX_00: ${{ secrets.KEYSTORE_HEX_00 }}
          KEYSTORE_HEX_01: ${{ secrets.KEYSTORE_HEX_01 }}
          KEYSTORE_HEX_02: ${{ secrets.KEYSTORE_HEX_02 }}
          KEYSTORE_HEX_03: ${{ secrets.KEYSTORE_HEX_03 }}
          KEYSTORE_HEX_04: ${{ secrets.KEYSTORE_HEX_04 }}
          KEYSTORE_HEX_05: ${{ secrets.KEYSTORE_HEX_05 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          CLEAN_HEX="${KEYSTORE_HEX_00}${KEYSTORE_HEX_01}${KEYSTORE_HEX_02}${KEYSTORE_HEX_03}${KEYSTORE_HEX_04}${KEYSTORE_HEX_05}"
          test -n "$CLEAN_HEX"
          printf 'keystore_hex_chars=%s\n' "${#CLEAN_HEX}"
          printf '%s' "$CLEAN_HEX" | xxd -r -p > "$RUNNER_TEMP/youneko-rate-release.jks"
          printf 'keystore_decoded_bytes=%s\n' "$(stat -c '%s' "$RUNNER_TEMP/youneko-rate-release.jks")"
          set +e
          keytool -list -keystore "$RUNNER_TEMP/youneko-rate-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"
          KEYTOOL_STATUS=$?
          set -e
          printf 'keytool_status=%s\n' "$KEYTOOL_STATUS"
          test "$KEYTOOL_STATUS" -eq 0

      - name: Assemble signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/youneko-rate-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Create or update GitHub Release and upload signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ASSET="youneko-rate-${RELEASE_TAG#v}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_ASSET"
          gh release delete-asset "$RELEASE_TAG" youneko-rate-20.01.07-debug.apk --yes 2>/dev/null || true
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
            gh release edit "$RELEASE_TAG" --title "Youneko Rate! ${RELEASE_TAG}"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \\
              --generate-notes \\
              --title "Youneko Rate! ${RELEASE_TAG}"
          fi
