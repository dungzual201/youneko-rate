<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000;overflow:hidden}</style>
</head>
<body>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const remote = new URL('https://covers.musichoarders.xyz/');
  ['theme','resolution','sources','country','artist','album','identifier','remote.port','remote.agent','remote.text']
    .forEach(function (key) {
      const value = params.get(key);
      if (value !== null && value !== '') remote.searchParams.set(key, value);
    });
  const frame = document.createElement('iframe');
  frame.src = remote.toString();
  frame.allow = 'clipboard-read; clipboard-write';
  document.body.appendChild(frame);
  window.addEventListener('message', function (event) {
    if (typeof event.data !== 'string') return;
    try {
      const message = JSON.parse(event.data);
      if (message && typeof message === 'object') {
        window.AndroidBridge.onPick(JSON.stringify(message));
      }
    } catch (_) { }
  });
})();
</script>
</body>
</html>
